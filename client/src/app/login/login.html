<div class="min-h-screen w-full bg-[#F4F4F4] flex items-center justify-center p-4 sm:p-6 lg:p-12 font-['Poppins',sans-serif]">
  <div class="max-w-6xl w-full flex flex-col md:flex-row items-center justify-center gap-8 lg:gap-16">
    
    <!-- Left Side: Login Illustration -->
    <div class="w-full md:w-1/2 flex items-center justify-center p-4">
      <img 
        src="login-illustration.png" 
        alt="Login Illustration" 
        class="w-full max-w-[440px] lg:max-w-[480px] h-auto object-contain drop-shadow-sm select-none" />
    </div>

    <!-- Right Side: Login Card -->
    <div class="w-full md:w-[480px] bg-white rounded-xl shadow-[0px_4px_24px_rgba(0,0,0,0.06)] p-8 sm:p-10 lg:p-12 flex flex-col justify-center">
      
      <!-- Header Titles -->
      <div class="mb-7">
        <h1 class="text-3xl lg:text-[34px] font-medium text-[#2F2F2F] leading-tight">
          Welcome to
        </h1>
        <h2 class="text-3xl lg:text-[36px] font-bold text-[#6358DC] leading-tight tracking-tight mt-0.5">
          Our Chat App
        </h2>
      </div>

      <!-- Login Form -->
      <form #loginForm="ngForm" (ngSubmit)="loginForm.valid && login()" class="flex flex-col gap-4">
        
        <!-- Email Input Container -->
        <div class="flex flex-col gap-1">
          <div class="relative bg-[#ECECEC] rounded-lg px-4 py-2.5 flex items-center gap-3.5 transition focus-within:ring-2 focus-within:ring-[#6358DC]/40 focus-within:bg-[#E8E8EB]">
            <!-- Mail Icon -->
            <svg class="w-5 h-5 text-[#2F2F2F] shrink-0" fill="currentColor" viewBox="0 0 24 24">
              <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
            
            <div class="flex flex-col flex-1">
              <label class="text-[11px] font-normal text-[#6B7280] leading-none mb-1">Email</label>
              <input 
                type="email" 
                name="email" 
                [(ngModel)]="email" 
                #emailModel="ngModel"
                required 
                email
                placeholder="example@gmail.com" 
                class="bg-transparent border-0 outline-none p-0 text-[#2F2F2F] text-[15px] font-bold placeholder:text-[#2F2F2F]/40 placeholder:font-normal" />
            </div>
          </div>
          
          <span *ngIf="emailModel.invalid && (emailModel.touched || loginForm.submitted)" class="text-xs text-red-500 font-medium px-1">
            Valid email is required
          </span>
        </div>

        <!-- Password Input Container -->
        <div class="flex flex-col gap-1">
          <div class="relative bg-[#ECECEC] rounded-lg px-4 py-2.5 flex items-center gap-3.5 transition focus-within:ring-2 focus-within:ring-[#6358DC]/40 focus-within:bg-[#E8E8EB]">
            <!-- Key / Lock Icon -->
            <svg class="w-5 h-5 text-[#2F2F2F] shrink-0" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12.65 10A5.99 5.99 0 0 0 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6a5.99 5.99 0 0 0 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
            </svg>

            <div class="flex flex-col flex-1">
              <label class="text-[11px] font-normal text-[#6B7280] leading-none mb-1">Password</label>
              <input 
                [type]="hidePassword ? 'password' : 'text'" 
                name="password" 
                [(ngModel)]="password" 
                #passwordModel="ngModel"
                required 
                placeholder="••••••••••••" 
                class="bg-transparent border-0 outline-none p-0 text-[#2F2F2F] text-[15px] font-bold placeholder:text-[#2F2F2F]/40" />
            </div>

            <!-- Eye Visibility Toggle Button -->
            <button 
              type="button" 
              (click)="hidePassword = !hidePassword"
              class="text-[#2F2F2F] hover:text-[#6358DC] transition p-1 cursor-pointer focus:outline-none"
              [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'">
              <svg *ngIf="hidePassword" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
              <svg *ngIf="!hidePassword" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
              </svg>
            </button>
          </div>

          <span *ngIf="passwordModel.invalid && (passwordModel.touched || loginForm.submitted)" class="text-xs text-red-500 font-medium px-1">
            Password is required
          </span>
        </div>

        <!-- Remember Me & Forgot Password Row -->
        <div class="flex items-center justify-between text-sm mt-1">
          <label class="flex items-center gap-2 cursor-pointer text-[#2F2F2F] select-none">
            <input 
              type="checkbox" 
              name="rememberMe" 
              [(ngModel)]="rememberMe"
              class="w-4 h-4 rounded border-[#D9D9D9] text-[#6358DC] focus:ring-[#6358DC]/30 accent-[#6358DC] cursor-pointer" />
            <span>Remember me</span>
          </label>
          <a href="javascript:void(0)" class="text-[#6358DC] font-medium hover:underline text-sm">
            Forgot Password?
          </a>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          [disabled]="loginForm.invalid || isLoading"
          class="w-full bg-[#6358DC] hover:bg-[#5246d6] text-white py-3.5 rounded-lg font-semibold text-base transition shadow-md shadow-[#6358DC]/20 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed mt-2 flex items-center justify-center gap-2">
          <svg *ngIf="isLoading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>{{ isLoading ? 'Logging in...' : 'Login' }}</span>
        </button>

        <!-- Feedback Messages -->
        <div *ngIf="errorMessage" class="p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-xs font-medium text-center">
          {{ errorMessage }}
        </div>
        <div *ngIf="successMessage" class="p-3 bg-emerald-50 border border-emerald-200 text-emerald-600 rounded-lg text-xs font-medium text-center">
          {{ successMessage }}
        </div>

        <!-- Footer Link -->
        <div class="text-center text-sm text-[#2F2F2F] mt-3">
          Don't have an account? 
          <a routerLink="/register" class="text-[#6358DC] font-semibold hover:underline ml-1">
            Register
          </a>
        </div>
      </form>

    </div>
  </div>
</div>
